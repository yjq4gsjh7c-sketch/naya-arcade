<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7d8ac"><meta name="apple-mobile-web-app-capable" content="yes"><title>Nayas Atelier · Naya Arcade</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./atelier.css?v=5"><script defer src="./atelier-model.js?v=5"></script><script defer src="./atelier.js?v=7"></script><link rel="stylesheet" href="./atelier-life.css?v=7"><script defer src="./atelier-life-model.js?v=7"></script><script defer src="./atelier-life.js?v=7"></script></head>
<body><main class="atelier"><header class="top"><a href="./index.html" class="bubble back" aria-label="Zurück zu den Spielen">➜</a><h1>Nayas Atelier<span>🌼</span></h1><div class="needs"><div class="need heart" aria-label="Freude"><span>♥</span><meter id="joy" min="0" max="100" value="100"></meter></div><div class="need apple" aria-label="Hunger"><span>🍎</span><meter id="hunger" min="0" max="100" value="82"></meter></div><div class="need water" aria-label="Durst"><span>💧</span><meter id="thirst" min="0" max="100" value="76"></meter></div></div><div class="actions"><button id="undo" class="bubble purple" aria-label="Rückgängig" disabled>↶</button><button id="music" class="bubble purple" aria-label="Musik einschalten" aria-pressed="false">♫</button><button id="save" class="bubble green" aria-label="Auf diesem Gerät gespeichert">✓</button></div></header>
<nav class="life-nav" aria-label="Deine Abenteuer"><button data-view="atelier" class="chosen">👗 <span>Atelier</span></button><button data-view="room">🏡 <span>Mein Zimmer</span></button><button data-view="adventures">🌈 <span>Abenteuer</span></button><button data-view="album">📸 <span>Album</span></button><button id="voice" aria-label="Stimme einschalten" aria-pressed="false">🔈</button></nav><div id="quest-guide" hidden><span id="quest-steps"></span><button id="quest-go">➜</button><button id="quest-stop" aria-label="Abenteuer beenden">×</button></div><section class="playroom"><aside class="snacks" aria-label="Essen und Trinken"><button class="care-tile" data-care="food" aria-label="Eine Erdbeere geben"><span class="art strawberry"></span><span class="care-meter"><i id="food-fill"></i></span></button><button class="care-tile" data-care="drink" aria-label="Ein Glas Wasser geben"><span class="art glass"></span><span class="care-meter blue"><i id="water-fill"></i></span></button></aside><div id="avatar-zone" role="group" aria-label="Dein Charakter: Kleidung und Dinge hierher ziehen"><div class="floor-shadow"></div><div id="doll-wrap"><canvas id="doll" width="640" height="1000" role="img" aria-label="Dein Charakter"></canvas></div><div id="drag-hint" aria-hidden="true">👆 <span>⤺</span></div><div id="reaction" role="status" aria-live="polite"></div><div id="care-hint" hidden></div></div><aside class="wardrobe" aria-label="Dein Kleiderschrank"><div id="items" role="group" aria-label="Dinge auswählen"></div><button id="page-next" aria-label="Weitere Dinge zeigen" hidden>➜</button></aside></section>
<section id="life-content" hidden>
<div id="room-view" class="life-view" hidden><div class="room-stage" id="room-stage" aria-label="Dein Zimmer: Möbel hierher ziehen"><div class="room-wash"></div><div id="room-objects"></div><img id="room-doll" alt="Dein Charakter im Zimmer"><span id="bed-dream" hidden>💤</span><button id="room-delete" aria-label="Ausgewähltes Möbel entfernen" hidden>🗑️</button><div class="room-tools"><button id="room-undo" aria-label="Zimmer: Rückgängig" disabled>↶</button><button id="room-light" aria-label="Licht ausschalten">💡</button><button id="room-sleep" aria-label="Schlafen gehen">🌙</button></div><button id="room-pet" class="pet-button" aria-label="Mimi streicheln"><canvas width="256" height="256" class="pet-canvas"></canvas><span class="pet-name">Mimi</span></button><div id="pet-hearts" aria-live="polite"></div></div>
<aside class="room-palette"><div class="room-furniture"><button data-furniture="bed" aria-label="Bett einsetzen"><canvas width="240" height="200"></canvas><small>Bett</small></button><button data-furniture="rug" aria-label="Teppich einsetzen"><canvas width="240" height="200"></canvas><small>Teppich</small></button><button data-furniture="lamp" aria-label="Lampe einsetzen"><canvas width="240" height="200"></canvas><small>Lampe</small></button><button data-furniture="plant" aria-label="Pflanze einsetzen"><canvas width="240" height="200"></canvas><small>Pflanze</small></button></div><div class="wall-colors" aria-label="Zimmerfarbe"><button data-wall="blush" aria-label="Zimmerfarbe Rosa">🌸</button><button data-wall="mint" aria-label="Zimmerfarbe Mint">🌿</button><button data-wall="lavender" aria-label="Zimmerfarbe Lila">🪻</button></div><div class="pet-care"><button data-pet="happy" aria-label="Kätzchen streicheln">💗</button><button data-pet="eat" aria-label="Kätzchen füttern">🥣</button><button data-pet="play" aria-label="Mit dem Kätzchen spielen">🧶</button><button id="pet-name-button" aria-label="Kätzchen einen Namen geben">✏️</button></div><button class="photo-button" data-photo>📸 <span>Foto!</span></button></aside></div>
<div id="adventures-view" class="life-view" hidden><h2>Was erleben wir heute?</h2><div class="adventure-cards"><button data-quest="picnic"><span class="quest-art">🧺 🌳 🐈</span><b>Unser Picknick</b><span class="quest-icons">👗 → 🍓 → 🐈</span><small>Los geht’s! ➜</small></button><button data-quest="party"><span class="quest-art">🎈 🎂 ✨</span><b>Eine kleine Party</b><span class="quest-icons">👗 → 💎 → 💡</span><small>Los geht’s! ➜</small></button><button data-quest="sleep"><span class="quest-art">🌙 🛏️ 🐈</span><b>Gute Nacht</b><span class="quest-icons">🛏️ → 💗 → 🌙</span><small>Los geht’s! ➜</small></button></div><p>Alles in deinem Tempo. Du kannst jederzeit aufhören.</p></div>
<div id="album-view" class="life-view" hidden><h2>Meine schönen Momente</h2><div class="album-actions"><button data-photo>📸 Neues Foto</button><button id="album-undo" aria-label="Album: Rückgängig" disabled>↶</button><button data-frame="pink" aria-label="Rosa Rahmen">🌸</button><button data-frame="mint" aria-label="Mint Rahmen">🌿</button><button data-frame="lavender" aria-label="Lila Rahmen">🪻</button></div><div id="album-grid"></div><p id="album-empty">📸 Zieh etwas Schönes an und mach ein Foto!</p></div>
</section><button id="atelier-photo" class="quick-photo" data-photo aria-label="Ein Foto für dein Album machen">📸</button><button id="atelier-pet" class="pet-button" aria-label="Mimi streicheln"><canvas width="256" height="256" class="pet-canvas"></canvas></button><nav class="categories" aria-label="Was möchtest du ändern?"><button data-category="clothes" class="active" aria-pressed="true"><span class="art cat-dress"></span><b>Kleider</b></button><button data-category="hair" aria-pressed="false"><span class="art cat-hair"></span><b>Haare</b></button><button data-category="shoes" aria-pressed="false"><span class="art cat-shoes"></span><b>Schuhe</b></button><button data-category="jewelry" aria-pressed="false"><span class="art cat-jewelry"></span><b>Schmuck</b></button><button data-category="makeup" aria-pressed="false"><span class="art cat-lip"></span><b>Farben</b></button><button data-category="food" aria-pressed="false"><span class="art cat-food"></span><b>Essen</b></button></nav><div id="loading" role="status">🌸 <span>Dein Atelier wird vorbereitet…</span></div><div id="drag-ghost" hidden aria-hidden="true"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="pet-dialog"><form method="dialog"><h2>Wie heisst dein Kätzchen?</h2><div>🐈 💗</div><input id="pet-name-input" maxlength="16" aria-label="Name des Kätzchens" autocomplete="off"><button id="pet-name-save" value="save">✓</button><button value="cancel" aria-label="Schliessen">×</button></form></dialog><dialog id="quest-finish"><div class="finish-art">🌈 ✨ 💗</div><h2 id="finish-title">Das war schön!</h2><p>Ein schöner Moment für dein Album!</p><button id="finish-photo">📸 Foto!</button><button id="finish-close">✓ Weiter spielen</button></dialog></main></body></html>
