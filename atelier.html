<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7d8ac"><meta name="apple-mobile-web-app-capable" content="yes"><title>Nayas Atelier · Naya Arcade</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./atelier.css?v=5"><script defer src="./atelier-model.js?v=5"></script><script defer src="./atelier.js?v=6"></script></head>
<body><main class="atelier"><header class="top"><a href="./index.html" class="bubble back" aria-label="Zurück zu den Spielen">➜</a><h1>Nayas Atelier<span>🌼</span></h1><div class="needs"><div class="need heart" aria-label="Freude"><span>♥</span><meter id="joy" min="0" max="100" value="100"></meter></div><div class="need apple" aria-label="Hunger"><span>🍎</span><meter id="hunger" min="0" max="100" value="82"></meter></div><div class="need water" aria-label="Durst"><span>💧</span><meter id="thirst" min="0" max="100" value="76"></meter></div></div><div class="actions"><button id="undo" class="bubble purple" aria-label="Rückgängig" disabled>↶</button><button id="music" class="bubble purple" aria-label="Musik einschalten" aria-pressed="false">♫</button><button id="save" class="bubble green" aria-label="Auf diesem Gerät gespeichert">✓</button></div></header>
<section class="playroom"><aside class="snacks" aria-label="Essen und Trinken"><button class="care-tile" data-care="food" aria-label="Eine Erdbeere geben"><span class="art strawberry"></span><span class="care-meter"><i id="food-fill"></i></span></button><button class="care-tile" data-care="drink" aria-label="Ein Glas Wasser geben"><span class="art glass"></span><span class="care-meter blue"><i id="water-fill"></i></span></button></aside><div id="avatar-zone" role="group" aria-label="Dein Charakter: Kleidung und Dinge hierher ziehen"><div class="floor-shadow"></div><div id="doll-wrap"><canvas id="doll" width="640" height="1000" role="img" aria-label="Dein Charakter"></canvas></div><div id="drag-hint" aria-hidden="true">👆 <span>⤺</span></div><div id="reaction" role="status" aria-live="polite"></div><div id="care-hint" hidden></div></div><aside class="wardrobe" aria-label="Dein Kleiderschrank"><div id="items" role="group" aria-label="Dinge auswählen"></div><button id="page-next" aria-label="Weitere Dinge zeigen" hidden>➜</button></aside></section>
<nav class="categories" aria-label="Was möchtest du ändern?"><button data-category="clothes" class="active" aria-pressed="true"><span class="art cat-dress"></span><b>Kleider</b></button><button data-category="hair" aria-pressed="false"><span class="art cat-hair"></span><b>Haare</b></button><button data-category="shoes" aria-pressed="false"><span class="art cat-shoes"></span><b>Schuhe</b></button><button data-category="jewelry" aria-pressed="false"><span class="art cat-jewelry"></span><b>Schmuck</b></button><button data-category="makeup" aria-pressed="false"><span class="art cat-lip"></span><b>Farben</b></button><button data-category="food" aria-pressed="false"><span class="art cat-food"></span><b>Essen</b></button></nav><div id="loading" role="status">🌸 <span>Dein Atelier wird vorbereitet…</span></div><div id="drag-ghost" hidden aria-hidden="true"></div><div id="toast" role="status" aria-live="polite"></div></main></body></html>
